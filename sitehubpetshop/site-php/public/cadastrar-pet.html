<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubPet — Cadastrar Pet</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="fundo-gradiente-escuro">

<div class="tela-painel">
  <div class="topo-interno">
    <button class="btn-icone" onclick="window.location.href='meus-pets.html'" data-icone="arrow-left" aria-label="Voltar"></button>
    <h1>Cadastrar Pet</h1>
    <span style="width:28px"></span>
  </div>

  <div class="painel-branco">
    <form id="form-pet" novalidate>
      <div class="campo">
        <label for="nome">Nome do pet</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Luna" required>
      </div>

      <div class="campo-linha">
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="Cachorro">Cachorro</option>
            <option value="Gato">Gato</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="campo">
          <label for="sexo">Sexo</label>
          <select id="sexo" name="sexo">
            <option value="Macho">Macho</option>
            <option value="Fêmea">Fêmea</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label for="raca">Raça</label>
        <input type="text" id="raca" name="raca" placeholder="Ex.: SRD, Labrador">
      </div>

      <div class="campo-linha">
        <div class="campo">
          <label for="idade">Idade</label>
          <input type="text" id="idade" name="idade" placeholder="Ex.: 2 anos">
        </div>
        <div class="campo">
          <label for="peso">Peso</label>
          <input type="text" id="peso" name="peso" placeholder="Ex.: 8 kg">
        </div>
      </div>

      <div class="campo">
        <label for="nascimento">Nascimento</label>
        <input type="text" id="nascimento" name="nascimento" placeholder="Ex.: 01/2023">
      </div>

      <button type="submit" id="btn-salvar" class="btn-primario">CADASTRAR PET</button>
    </form>
  </div>
</div>

<script type="module" src="assets/js/pages/cadastrar-pet.js"></script>
</body>
</html>
