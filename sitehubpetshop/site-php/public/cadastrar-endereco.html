<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubPet — Cadastrar Endereço</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="fundo-gradiente-escuro">

<div class="tela-painel">
  <div class="topo-interno">
    <button class="btn-icone" id="btn-voltar-endereco" data-icone="arrow-left" aria-label="Voltar"></button>
    <h1>Cadastrar Endereço</h1>
    <span style="width:28px"></span>
  </div>

  <div class="painel-branco">
    <form id="form-endereco" novalidate>
      <div class="campo">
        <label for="titulo">Apelido (opcional)</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex.: Casa, Trabalho">
      </div>
      <div class="campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="9">
      </div>
      <div class="campo">
        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua" required>
      </div>
      <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" required>
      </div>
      <div class="campo">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento">
      </div>
      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro" required>
      </div>
      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>
      </div>
      <label class="campo-checkbox">
        <input type="checkbox" name="principal">
        Definir como endereço principal
      </label>
      <button type="submit" id="btn-salvar" class="btn-primario">SALVAR ENDEREÇO</button>
    </form>
  </div>
</div>

<script type="module" src="assets/js/pages/cadastrar-endereco.js"></script>
</body>
</html>
