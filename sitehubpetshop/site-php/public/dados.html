<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubPet — Meus Dados</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">

</head>
<body class="fundo-gradiente-escuro">

<div class="tela-painel">
  <div class="topo-interno">
    <button class="btn-icone" onclick="window.location.href='minha-conta.html'" data-icone="arrow-left" aria-label="Voltar"></button>
    <h1>Meus Dados</h1>
    <span style="width:28px"></span>
  </div>

  <div class="painel-branco">
    <div class="campo"><label>Nome completo</label><input type="text" id="nome" disabled></div>

    <div class="campo"><label>E-mail</label><input type="text" id="email" disabled></div>
    <div class="campo"><label>Telefone</label><input type="text" id="telefone" disabled></div>
    <div class="campo"><label>Tipo de conta</label><input type="text" id="tipoUsuario" disabled></div>
    <p style="font-size:13px; color:var(--cor-texto-secundario);">
      A edição de dados cadastrais não está disponível nesta versão — fale
      com o suporte para alterações.
    </p>
  </div>
</div>

<script type="module" src="assets/js/pages/dados.js"></script>

</html>
