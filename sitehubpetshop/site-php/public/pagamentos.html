
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubPet — Finalizar Pedido</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="fundo-gradiente-principal">

<div class="tela-painel">
  <div class="topo-interno">
    <button class="btn-icone" onclick="window.location.href='carrinho.html'" data-icone="arrow-left" aria-label="Voltar"></button>
    <h1>Finalizar Pedido</h1>
    <span style="width:28px"></span>
  </div>

  <div class="painel-branco">
    <h2 style="margin-top:0;">1. Resumo do pedido</h2>
    <div id="resumo-itens"></div>
    <div class="linha-total total-final">
      <span>Total</span>
      <span id="total-pedido">R$ 0,00</span>
    </div>

    <h2>2. Endereço de entrega</h2>
    <div id="lista-enderecos-checkout">
      <div class="spinner"></div>
    </div>

    <h2>3. Forma de pagamento</h2>
    <div id="opcoes-pagamento">
      <label class="opcao-radio">
        <input type="radio" name="pagamento" value="Pix (pago na entrega)">
        <span class="opcao-radio__icone" data-icone="zap" data-tamanho="20"></span>
        <span class="opcao-radio__texto">
          <strong>Pix</strong>
          <small>Pago na entrega</small>
        </span>
      </label>

      <label class="opcao-radio">
        <input type="radio" name="pagamento" value="Dinheiro (pago na entrega)">
        <span class="opcao-radio__icone" data-icone="banknote" data-tamanho="20"></span>
        <span class="opcao-radio__texto">
          <strong>Dinheiro</strong>
          <small>Pago na entrega</small>
        </span>
      </label>

      <label class="opcao-radio">
        <input type="radio" name="pagamento" value="cartao">
        <span class="opcao-radio__icone" data-icone="credit-card" data-tamanho="20"></span>
        <span class="opcao-radio__texto">
          <strong>Cartão</strong>
          <small>Débito ou crédito</small>
        </span>
      </label>
    </div>

    <div id="dados-cartao" hidden>
      <div class="campo" id="campo-tipo-cartao">
        <label for="tipoCartao">Tipo de cartão</label>
        <select id="tipoCartao">
          <option value="debito">Débito</option>
          <option value="credito">Crédito</option>
        </select>
      </div>

      <div class="campo">
        <label for="nomeCartao">Nome impresso no cartão</label>
        <input
          id="nomeCartao"
          type="text"
          autocomplete="cc-name"
          placeholder="Como aparece no cartão"
        >
      </div>

      <div class="campo">
        <label for="numeroCartao">Número do cartão</label>
        <input
          id="numeroCartao"
          type="text"
          inputmode="numeric"
          autocomplete="cc-number"
          placeholder="0000 0000 0000 0000"
          maxlength="19"
        >
      </div>

      <div class="campo-linha">
        <div class="campo">
          <label for="validadeCartao">Validade</label>
          <input
            id="validadeCartao"
            type="text"
            inputmode="numeric"
            autocomplete="cc-exp"
            placeholder="MM/AA"
            maxlength="5"
          >
        </div>

        <div class="campo">
          <label for="cvvCartao">CVV</label>
          <input
            id="cvvCartao"
            type="password"
            inputmode="numeric"
            autocomplete="cc-csc"
            placeholder="123"
            maxlength="4"
          >
        </div>
      </div>

      <div class="campo" id="campo-parcelas" hidden>
        <label for="parcelas">Deseja parcelar?</label>
        <select id="parcelas">
          <option value="1">À vista (1x)</option>
          <option value="2">2x sem juros</option>
          <option value="3">3x sem juros</option>
          <option value="4">4x sem juros</option>
          <option value="5">5x sem juros</option>
          <option value="6">6x sem juros</option>
          <option value="7">7x sem juros</option>
          <option value="8">8x sem juros</option>
          <option value="9">9x sem juros</option>
          <option value="10">10x sem juros</option>
          <option value="11">11x sem juros</option>
          <option value="12">12x sem juros</option>
        </select>

        <small
          id="valor-parcela"
          style="display:block; margin-top:6px; color:var(--cor-texto-secundario);"
        ></small>
      </div>

      <p style="font-size:12px; color:var(--cor-texto-secundario);">
        Demonstração: os dados do cartão não serão salvos nem enviados.
      </p>
    </div>

    <button type="button" id="btn-finalizar" class="btn-primario">
      FINALIZAR PEDIDO
    </button>
  </div>
</div>

<script type="module" src="assets/js/pages/pagamentos.js"></script>
</body>
</html>
