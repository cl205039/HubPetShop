<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubPet — Cadastro</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="fundo-clean">

<div class="tela-centralizada">
  <div class="login-card login-card--largo">
    <button type="button" class="login-card__voltar" onclick="history.back()" data-icone="arrow-left" aria-label="Voltar"></button>
    <div class="marca">
      <img src="assets/images/logo.png" alt="HubPet Shop" class="logo-marca">
      <h1>Criar conta</h1>
    </div>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>
      </div>
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="campo">
        <label for="confirmarEmail">Confirmar e-mail</label>
        <input type="email" id="confirmarEmail" name="confirmarEmail" required>
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" placeholder="(11) 90000-0000" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required>
      </div>
      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="6" required>
      </div>
      <div class="campo">
        <label for="tipoUsuario">Tipo de conta</label>
        <select id="tipoUsuario" name="tipoUsuario" required>
          <option value="pessoafisica">Pessoa Física</option>
          <option value="pessoajuridica">Pessoa Jurídica</option>
        </select>
      </div>

      <label class="campo-checkbox">
        <input type="checkbox" name="aceitaNewsletter">
        Quero receber novidades e promoções por e-mail.
      </label>
      <label class="campo-checkbox">
        <input type="checkbox" name="aceitaTermos" required>
        Li e aceito os termos de uso.
      </label>

      <button type="submit" id="btn-cadastrar" class="btn-primario">FINALIZAR CADASTRO</button>
    </form>

    <p class="link-secundario">Já tem conta? <a href="index.html">Entrar</a></p>
  </div>
</div>

<script type="module" src="assets/js/pages/cadastro.js"></script>
</body>
</html>
