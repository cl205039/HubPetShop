org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# O caminho do projeto tem acentos ("Área de Trabalho"), o que o Android
# Gradle Plugin trata como erro fatal por padrão no Windows. Essa flag
# desativa só essa checagem; o toolchain atual (AAPT2/NDK moderno) lida
# bem com caminhos UTF-8 na prática.
android.overridePathCheck=true
